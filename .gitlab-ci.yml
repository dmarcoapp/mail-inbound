# Deployment pipeline for the DMARCo project's own server.
#
# This is not part of installing DMARCo, and it is not something you need to
# fork or copy. To run DMARCo yourself, use the ready-made stack and installer
# in https://github.com/dmarcoapp/dmarcoapp instead.
#
# The job is manual and expects DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH and
# SSH_PRIVATE_KEY to be set as protected GitLab CI variables.

stages:
  - deploy

deploy:
  stage: deploy
  image: debian:bookworm-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends openssh-client ca-certificates
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - echo "Deploying to production server..."
    - |
      ssh -p 22 "$DEPLOY_USER@$DEPLOY_HOST" << EOF
      set -euo pipefail
      cd "$DEPLOY_PATH"
      docker compose pull --ignore-buildable
      docker compose up -d --remove-orphans
      EOF
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - when: never
