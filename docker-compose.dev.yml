services:
  postfix:
    environment:
      SMTP_TLS_MODE: self-signed

  processor:
    environment:
      WEBHOOK_URL: http://webhook-dev:3000/inbound-email
    depends_on:
      clamav:
        condition: service_started
      webhook-dev:
        condition: service_started

  webhook-dev:
    build: .
    container_name: mail-webhook-dev
    command: ["node", "src/dev/webhookReceiver.js"]
    env_file:
      - .env
      - path: .env.local
        required: false
    secrets:
      - webhook_secret
    ports:
      - "3000:3000"
    restart: unless-stopped
