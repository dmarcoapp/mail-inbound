name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  node:
    name: Node checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Run coverage
        run: npm run coverage

  docker:
    name: Docker Compose build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create CI Compose inputs
        run: |
          cp .env.example .env
          mkdir -p secrets
          printf 'ci-webhook-secret\n' > secrets/webhook_secret.txt
          printf 'ci-access-key\n' > secrets/s3_access_key.txt
          printf 'ci-secret-key\n' > secrets/s3_secret_key.txt
          printf 'unused\n' > secrets/cloudflare_token.txt

      - name: Validate Compose config
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config

      - name: Build images
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml build postfix processor webhook-dev
          docker build -f certbot/Dockerfile -t mail-inbound-certbot-ci .
          docker build -f certbot/exporter.Dockerfile -t mail-inbound-cert-exporter-ci .
